name: dbs-csci341-a3-part1
services:
  db:
    image: postgres:16.4
    container_name: dbs-csci341-a3-part1-db
    environment:
      POSTGRES_DB: csci341_a3_part1
      POSTGRES_USER: csci341_part1
      POSTGRES_PASSWORD: ${PART1_DB_PASSWORD:?Set PART1_DB_PASSWORD in your local .env}
      TZ: UTC
    ports:
      - "127.0.0.1:55431:5432"
    volumes:
      - part1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csci341_part1 -d csci341_a3_part1"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  part1_data:
